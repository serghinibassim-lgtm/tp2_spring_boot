services:
  mariadb:
    image: mariadb:latest
    container_name: mariadb-spring_security
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: db_spring_secur
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_spring_data:/var/lib/mysql

volumes:
  mariadb_spring_data: